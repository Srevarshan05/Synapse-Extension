<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse v2 — Offscreen Worker Host</title>
  <!--
    This document is intentionally invisible (offscreen).
    It serves as the host for Synapse's processing workers:
      - compression.worker.js  (gzip via CompressionStream)
      - pdf.worker.js          (PDF.js text extraction — Phase 4)
      - ocr.worker.js          (Tesseract.js OCR — Phase 4, Deep mode only)
      - attachment.worker.js   (DOCX/CSV/TXT — Phase 4)

    Background service worker spawns this document, then routes
    processing tasks through it via chrome.runtime.sendMessage.
    Workers send results back via postMessage → offscreen → background.
  -->
</head>
<body>
  <script src="offscreen.js"></script>
</body>
</html>
